# This repo is not a package; the table exists only to pin the environment
# floor.  Without an explicit requires-python, uv silently defaults to the
# locking machine's interpreter, so the floor would drift unnoticed.
[project]
name = "rebrew-toolchains"
# Nominal (nothing here is packaged or published); required by PEP 621.
version = "1.0.0"
requires-python = ">=3.13"

[tool.ruff]
# Matches requires-python above (the only interpreters that can run this
# tree); bump both together or pyupgrade/mypy reason about a dead dialect.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Defect-first selection: pyflakes + pycodestyle errors/warnings, bugbear
# (bug-prone constructs), flake8-simplify/return hygiene, comprehension
# modernization, pyupgrade, import sorting and ruff-native correctness.
# Anything disabled must be recorded here with a reason.
select = [
    "E",    # pycodestyle errors (incl. line length)
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "UP",   # pyupgrade
    "RUF",  # ruff-specific correctness
    # Additional groups the tree already passes clean (proven by run); they
    # guard new code against the defect classes they name.
    "A",    # flake8-builtins (shadowing builtins)
    "N",    # pep8-naming (naming drift breaks callers)
    "ARG",  # unused arguments (dead parameters)
    "S",    # bandit (weak crypto, eval, assert misuse)
    "EXE",  # shebang/executable-bit consistency (this module is a script)
    "ISC",  # implicit string concatenation (classic silent-bug source)
    "DTZ",  # naive datetimes
    "YTT",  # sys/version pitfalls
    "RSE",  # redundant parentheses on raise
    "SLF",  # private member access from outside
    "TID",  # banned/relative imports
    "PTH",  # os.path -> pathlib (already the module's convention)
    "FLY",  # locale-aware joins
    "PERF", # performance antipatterns
    "FURB", # misc modernization/correctness
    # Error-grade groups the tree already passes clean (proven by run); they
    # guard new code against the defect classes they name.
    "PLE",  # pylint errors (duplicate kwargs, bad str/format use, ...)
    "FBT",  # boolean positional traps in callables
    "PGH",  # blanket `# noqa` / `# type: ignore` without a rule code
    # Defect-grade groups the tree already passes clean (proven by run).
    "T10",  # breakpoint()/pdb imports left in committed code
    "PIE",  # duplicated class fields, non-unique enum values, dead constructs
    "PLW",  # pylint warnings (self-assignment, useless loop branches, ...)
    # Deliberately not enabled: PL (PLR2004 magic values / PLR0915 function
    # length fire on the Pak header parser; fixing those belongs to
    # code-review passes, not config; error-only PLE is enabled above),
    # T20 (T201 print is the module's intended CLI output), ANN/Q/G/LOG
    # (redundant with mypy strict, the formatter, or absent logging), INP
    # (tests are script-style by design; an __init__.py would be dead weight).
]

[tool.mypy]
strict = true
# Matches requires-python above; bump both together (see [tool.ruff]).
python_version = "3.13"
# Not part of `strict`: flags dead code and impossible branches as errors.
warn_unreachable = true
# Not part of `strict`: bans explicit `Any` outright instead of merely
# allowing it; the tree carries none (proven by run).
disallow_any_explicit = true
# Check every Python file in the tree by default; mypy skips dot-directories
# during recursive discovery (.mypy_cache/.ruff_cache/.venv included), so new
# modules cannot be added outside analysis unnoticed.
files = ["."]

# CI installs this group through the committed uv.lock
# (`uv sync --group lint --locked`), so local runs and remote enforcement
# get the same hash-verified artifact set, never just the same version pins.

[dependency-groups]
lint = [
    "ruff==0.16.4",
    "mypy==2.1.0",
    # Wraps the upstream ShellCheck 0.11.0 binary under the `shellcheck`
    # command; keeps the shell analyzer in the same pinned set.
    "shellcheck-py==0.11.0.1",
]
